async function makeMixed(coverBlob){if(!signalSamples||mode!=='hidden')return;$('#coverState').textContent=t('coverProcessing');$('#mixedBox').classList.remove('show');let ad;try{ad=await audioData(coverBlob)}catch{$('#coverState').textContent=t('fileError');return}const offset=Math.round(.22*SR),needed=signalSamples.length+offset+Math.round(.18*SR),out=new Float32Array(Math.max(needed,Math.round(ad.a.length*SR/ad.sr)));let peak=.001;for(const x of ad.a)peak=Math.max(peak,Math.abs(x));const gain=Math.min(1,.78/peak);for(let i=0;i<out.length;i++){const src=(i*ad.sr/SR)%ad.a.length,j=Math.floor(src),q=src-j;out[i]=((ad.a[j]||0)*(1-q)+(ad.a[(j+1)%ad.a.length]||0)*q)*gain}for(let i=0;i<signalSamples.length;i++){const k=i+offset;out[k]=Math.max(-.97,Math.min(.97,out[k]+signalSamples[i]))}mixedBlob=wav(out);$('#mixedPlayer').src=URL.createObjectURL(mixedBlob);$('#mixedInfo').textContent=t('mixedInfo');$('#mixedBox').classList.add('show');$('#coverState').textContent=t('coverReady')}
function updateEstimate(){const n=TE.encode($('#text').value).length,p=PROFILES[mode],extra=$('#password').value?36:0;$('#count').textContent=`${[...$('#text').value].length.toLocaleString(lang==='fa'?'fa-IR':'en')} / 500`;$('#duration').textContent=n?`${lang==='fa'?'حدود':'About'} ${(.36+(n+9+extra)*2*p.sd).toFixed(1)} s`:t('duration')}
$('.modes').onclick=e=>{const b=e.target.closest('.mode');if(!b)return;document.querySelectorAll('.mode').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;$('#cover').classList.toggle('show',mode==='hidden');signalBlob=signalSamples=mixedBlob=null;$('#signalBox').classList.remove('show');$('#mixedBox').classList.remove('show');$('#downloadSignal').disabled=true;updateEstimate()};$('#text').oninput=updateEstimate;$('#password').oninput=updateEstimate;$('#strength').onchange=()=>{PROFILES.hidden.amp=Number($('#strength').value);if(mode==='hidden')signalSamples=null};
$('#build').onclick=async()=>{const text=$('#text').value;if(!text.trim())return;$('#build').disabled=true;$('#build').textContent=t('building');try{const p=PROFILES[mode],packet=await makePacket(text,$('#password').value,p.id);signalSamples=modulate(packet,p);signalDuration=signalSamples.length/SR;signalBlob=wav(signalSamples);mixedBlob=null;$('#signalPlayer').src=URL.createObjectURL(signalBlob);$('#signalBox').classList.add('show');$('#mixedBox').classList.remove('show');$('#signalInfo').textContent=`${t('signalReady')} • ${signalDuration.toFixed(1)} s`;$('#profileTag').textContent=t(mode==='fast'?'profileFast':'profileHidden');$('#downloadSignal').disabled=false;$('#cover').classList.toggle('show',mode==='hidden');$('#neededTime').textContent=(signalDuration+.6).toFixed(1)+' s';$('#coverState').textContent='';if(mode==='hidden'&&pendingCoverBlob)await makeMixed(pendingCoverBlob)}finally{$('#build').disabled=false;$('#build').textContent=t('build')}};$('#downloadSignal').onclick=()=>dl(signalBlob,mode==='hidden'?'audio-qr-hidden-signal.wav':'audio-qr-fast.wav');$('#downloadMixed').onclick=()=>dl(mixedBlob,'audio-qr-hidden-mixed.wav');$('#coverFile').onchange=e=>{const f=e.target.files[0];if(!f)return;pendingCoverBlob=f;if(signalSamples&&mode==='hidden')makeMixed(f);else $('#coverState').textContent=lang==='fa'?'فایل انتخاب شد؛ ابتدا سیگنال را بساز.':'File selected; create the signal first.'};
$('#coverRecord').onclick=async()=>{if(coverRecorder?.state==='recording'){coverRecorder.stop();return}if(!signalSamples||mode!=='hidden')return;try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});coverChunks=[];coverRecorder=new MediaRecorder(stream);coverRecorder.ondataavailable=e=>e.data.size&&coverChunks.push(e.data);coverRecorder.onstop=async()=>{clearTimeout(coverTimer);stream.getTracks().forEach(x=>x.stop());$('#coverRecord').classList.remove('on');$('#coverRecord').textContent=t('recordCover');await makeMixed(new Blob(coverChunks,{type:coverRecorder.mimeType}))};coverRecorder.start(250);$('#coverRecord').classList.add('on');$('#coverRecord').textContent=t('coverRecording');$('#coverState').textContent=t('coverRecording');coverTimer=setTimeout(()=>coverRecorder.state==='recording'&&coverRecorder.stop(),(signalDuration+.75)*1000)}catch{$('#coverState').textContent=t('micError')}};
document.querySelectorAll('.tab').forEach(x=>x.onclick=()=>{document.querySelectorAll('.tab').forEach(y=>y.classList.remove('active'));x.classList.add('active');document.querySelectorAll('.pane').forEach(y=>y.classList.remove('active'));$('#'+x.dataset.tab+'Pane').classList.add('active')});function show(text,err=false,profile=''){const r=$('#result');r.className='result show '+(err?'err':'ok');$('#resultLabel').textContent=err?(lang==='fa'?'خطا':'Error'):`${t('result')}${profile?' • '+profile:''}`;$('#resultText').textContent=text;$('#copy').style.display=err?'none':'inline-flex'}async function handle(blob){show(t('decodeWorking'));try{const r=await decodeBlob(blob,$('#decodePassword').value);show(r.text,false,r.profile)}catch(e){show(e.message,true)}}$('#decodeFile').onchange=e=>e.target.files[0]&&handle(e.target.files[0]);$('#listenBtn').onclick=async()=>{if(listenRecorder?.state==='recording'){listenRecorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});listenChunks=[];listenRecorder=new MediaRecorder(stream);listenRecorder.ondataavailable=e=>e.data.size&&listenChunks.push(e.data);listenRecorder.onstop=()=>{stream.getTracks().forEach(x=>x.stop());$('#listenBtn').textContent=t('listenStart');handle(new Blob(listenChunks,{type:listenRecorder.mimeType}))};listenRecorder.start(250);$('#listenBtn').textContent=t('listenStop')}catch{show(t('micError'),true)}};$('#copy').onclick=async()=>{await navigator.clipboard.writeText($('#resultText').textContent);$('#copy').textContent=t('copied');setTimeout(()=>$('#copy').textContent=t('copy'),1100)};$('#langEn').onclick=()=>setLang('en');$('#langFa').onclick=()=>setLang('fa');setLang(localStorage.getItem('audioQrLang')||lang);
