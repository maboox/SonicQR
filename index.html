<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fb">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; media-src 'self' blob:; worker-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <link rel="icon" href="./icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Audio QR</title>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <a class="brand" href="#" aria-label="Audio QR"><span class="brand-mark" data-icon="wave"></span><span>Audio<span class="brand-light"> QR</span></span></a>
      <div class="header-actions">
        <span class="offline-badge"><span class="dot"></span><span data-i18n="offline"></span></span>
        <button class="icon-button" id="helpBtn" data-icon="help" data-title="help" aria-label="Help"></button>
        <button class="language-button" id="languageBtn" aria-label="Change language">فارسی</button>
      </div>
    </header>
    <main>
      <section class="intro">
        <span class="eyebrow" data-i18n="eyebrow"></span>
        <h1 data-i18n="headline"></h1>
        <p data-i18n="tagline"></p>
      </section>
      <nav class="main-tabs" role="tablist" aria-label="Workspace">
        <button id="sendTab" role="tab" aria-selected="true" aria-controls="sendPanel" class="main-tab active"><span data-icon="send"></span><span data-i18n="send"></span></button>
        <button id="receiveTab" role="tab" aria-selected="false" aria-controls="receivePanel" class="main-tab"><span data-icon="receive"></span><span data-i18n="receive"></span></button>
      </nav>
      <section id="sendPanel" role="tabpanel" aria-labelledby="sendTab" class="workspace">
        <article class="card composer">
          <div class="card-heading"><div class="step-icon" data-icon="message"></div><div><h2 data-i18n="compose"></h2><p data-i18n="composeHint"></p></div></div>
          <label for="message" data-i18n="message"></label>
          <div class="textarea-wrap"><textarea id="message" dir="auto" rows="5" data-placeholder="messagePlaceholder" spellcheck="false"></textarea><button id="clearMessage" class="icon-button" data-icon="close" data-title="clear" aria-label="Clear message"></button></div>
          <div class="field-meta"><span id="messageCount" dir="auto"></span><span id="estimate" dir="auto"></span></div>
          <label data-i18n="profile"></label>
          <div class="profile-options" role="group" aria-label="Audio profile">
            <button class="profile-option selected" data-profile="fast" aria-pressed="true"><span class="profile-icon" data-icon="speaker"></span><span><strong data-i18n="fast"></strong><small data-i18n="fastHint"></small></span><span class="radio-dot"></span></button>
            <button class="profile-option" data-profile="hidden" aria-pressed="false"><span class="profile-icon" data-icon="layers"></span><span><strong data-i18n="hidden"></strong><small data-i18n="hiddenHint"></small></span><span class="radio-dot"></span></button>
          </div>
          <details class="privacy-options"><summary><span data-icon="lock"></span><span data-i18n="encryption"></span><span class="optional" data-i18n="optional"></span><span data-icon="chevron"></span></summary><div class="details-content"><label for="password" data-i18n="password"></label><div class="password-field"><input type="password" id="password" autocomplete="new-password" data-placeholder="passwordPlaceholder"><button class="icon-button reveal" data-target="password" data-icon="eye" data-title="reveal" aria-label="Show password"></button></div><p class="field-help" data-i18n="encryptionHint"></p></div></details>
          <div class="notice error" id="sendError" hidden role="alert"></div>
          <button class="button primary full" id="buildBtn" disabled><span data-icon="wave"></span><span id="buildLabel" data-i18n="createSignal"></span></button>
        </article>
        <aside class="output-column">
          <article class="card output-card">
            <div class="section-top"><h2 data-i18n="yourAudio"></h2><span class="mini-badge" id="outputBadge" data-i18n="waiting"></span></div>
            <div class="wave-art" id="waveArt" aria-hidden="true"></div>
            <div id="outputEmpty" class="empty-state"><h3 data-i18n="audioEmptyTitle"></h3><p data-i18n="audioEmptyHint"></p></div>
            <div id="outputReady" hidden>
              <div class="audio-description"><strong id="signalTitle"></strong><span id="signalMeta" dir="auto"></span></div>
              <audio id="signalPlayer" controls preload="metadata"></audio>
              <div class="action-row"><button class="button secondary" id="saveSignal"><span data-icon="download"></span><span data-i18n="saveWav"></span></button><button class="button secondary android-only" id="shareSignal" hidden><span data-icon="share"></span><span data-i18n="share"></span></button></div>
            </div>
          </article>
          <article class="card cover-card" id="coverCard" hidden>
            <div class="card-heading"><div class="step-icon" data-icon="mic"></div><div><h2 data-i18n="coverTitle"></h2><p data-i18n="coverHint"></p></div></div>
            <div class="two-fields"><div><label for="strength" data-i18n="strength"></label><select id="strength"><option value="0.035" data-i18n="subtle"></option><option value="0.055" selected data-i18n="balanced"></option><option value="0.08" data-i18n="robust"></option></select></div><div class="time-box"><span data-i18n="neededTime"></span><strong id="coverDuration" dir="auto">—</strong></div></div>
            <div class="action-row"><button class="button secondary" id="coverRecord" disabled><span data-icon="mic"></span><span id="coverRecordLabel" data-i18n="recordCover"></span></button><label class="button secondary file-button"><span data-icon="folder"></span><span data-i18n="chooseFile"></span><input id="coverFile" type="file" accept="audio/*,.wav,.mp3,.m4a,.webm,.ogg,.aac,.flac"></label></div>
            <div class="record-status" id="coverRecording" hidden><span class="record-dot"></span><span id="coverTimer" dir="ltr">00:00</span><progress id="coverProgress" max="1" value="0"></progress><button class="text-button" id="coverCancel" data-i18n="cancel"></button></div>
            <p id="coverStatus" class="field-help" aria-live="polite"></p>
            <div id="mixedReady" hidden><audio id="mixedPlayer" controls preload="metadata"></audio><div class="action-row"><button class="button primary" id="saveMixed"><span data-icon="download"></span><span data-i18n="saveMixed"></span></button><button class="button secondary android-only" id="shareMixed" hidden><span data-icon="share"></span><span data-i18n="share"></span></button></div></div>
            <p class="fine-print" data-i18n="hiddenWarning"></p>
          </article>
          <div class="tip-card"><span data-icon="bulb"></span><p id="sendTip" data-i18n="sendTip"></p></div>
        </aside>
      </section>
      <section id="receivePanel" role="tabpanel" aria-labelledby="receiveTab" class="workspace" hidden>
        <article class="card receive-card">
          <div class="card-heading"><div class="step-icon" data-icon="receive"></div><div><h2 data-i18n="receiveTitle"></h2><p data-i18n="receiveHint"></p></div></div>
          <div class="source-tabs" role="group" aria-label="Audio source"><button class="source-tab selected" data-source="microphone" aria-pressed="true"><span data-icon="mic"></span><span data-i18n="microphone"></span></button><button class="source-tab" data-source="file" aria-pressed="false"><span data-icon="folder"></span><span data-i18n="audioFile"></span></button></div>
          <div id="microphoneSource" class="capture-area">
            <div class="microphone-visual" id="microphoneVisual" data-icon="mic"></div>
            <h3 id="listenHeading" data-i18n="readyToListen"></h3><p id="listenHint" data-i18n="listenHint"></p>
            <div class="level-meter" id="levelMeter" aria-hidden="true"></div>
            <strong class="record-time" id="listenTimer" dir="ltr">00:00</strong>
            <button class="button primary" id="listenBtn"><span data-icon="mic"></span><span id="listenLabel" data-i18n="startRecording"></span></button>
            <button class="text-button" id="cancelRecording" data-i18n="cancel" hidden></button>
            <p class="fine-print" data-i18n="recordingLimit"></p>
          </div>
          <div id="fileSource" hidden><label class="drop-zone" id="dropZone"><input id="decodeFile" type="file" accept="audio/*,.wav,.mp3,.m4a,.webm,.ogg,.aac,.flac"><span class="file-orb" data-icon="upload"></span><strong data-i18n="chooseAudio"></strong><span data-i18n="fileHint"></span><span class="format-tags" dir="ltr">WAV · MP3 · M4A · WebM</span></label><p class="field-help file-name" id="decodeFilename" dir="auto"></p></div>
          <div class="decode-password"><label for="decodePassword" data-i18n="decodePassword"></label><div class="password-field"><input id="decodePassword" type="password" autocomplete="off" data-placeholder="decodePasswordPlaceholder"><button class="icon-button reveal" data-target="decodePassword" data-icon="eye" data-title="reveal" aria-label="Show password"></button></div></div>
          <div class="notice error" id="receiveError" hidden role="alert"></div>
          <button class="button secondary full" id="retryBtn" hidden><span data-icon="refresh"></span><span data-i18n="retry"></span></button>
          <button class="text-button" id="micSettings" hidden data-i18n="micSettings"></button>
        </article>
        <aside class="output-column">
          <article class="card decoded-card"><div class="section-top"><h2 data-i18n="decodedMessage"></h2><span class="mini-badge" id="resultBadge" data-i18n="waiting"></span></div>
            <div id="resultEmpty" class="result-empty"><span class="result-orb" data-icon="message"></span><h3 data-i18n="resultEmptyTitle"></h3><p data-i18n="resultEmptyHint"></p></div>
            <div class="analysis-state" id="analysisState" hidden><span class="spinner"></span><strong data-i18n="analyzing"></strong><progress id="decodeProgress" max="1" value="0"></progress><button class="text-button" id="cancelDecode" data-i18n="cancel"></button></div>
            <div id="resultReady" hidden><p class="result-profile" id="resultProfile"></p><div id="resultText" class="result-text" dir="auto" tabindex="0"></div><button class="button secondary" id="copyBtn"><span data-icon="copy"></span><span data-i18n="copy"></span></button></div>
          </article>
          <div class="tip-card"><span data-icon="bulb"></span><p data-i18n="receiveTip"></p></div>
        </aside>
      </section>
      <footer><span data-icon="shield"></span><span data-i18n="privacyFooter"></span><span class="version" dir="ltr">v1.1.0</span></footer>
    </main>
  </div>
  <dialog id="helpDialog"><div class="dialog-heading"><h2 data-i18n="help"></h2><button id="closeHelp" class="icon-button" data-icon="close" data-title="close" aria-label="Close"></button></div><div class="help-step"><span>1</span><div><h3 data-i18n="helpSendTitle"></h3><p data-i18n="helpSend"></p></div></div><div class="help-step"><span>2</span><div><h3 data-i18n="helpReceiveTitle"></h3><p data-i18n="helpReceive"></p></div></div><div class="help-step"><span>3</span><div><h3 data-i18n="helpHiddenTitle"></h3><p data-i18n="helpHidden"></p></div></div><div class="help-step"><span data-icon="lock"></span><div><h3 data-i18n="helpPrivacyTitle"></h3><p data-i18n="helpPrivacy"></p></div></div><button class="button primary full" id="helpDone" data-i18n="gotIt"></button></dialog>
  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
